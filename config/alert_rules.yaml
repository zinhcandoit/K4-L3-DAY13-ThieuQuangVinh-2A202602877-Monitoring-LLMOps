alerts:
  - name: api_latency_p95_breach
    severity: warning
    condition: latency_p95 > 3000ms
    duration: 3m
    type: symptom-based
    channel: slack
    owner: oncall-llmops
    runbook: docs/alerts.md#alert-1
  - name: retrieval_error_rate_high
    severity: critical
    condition: error_rate_pct > 2% or retrieval_success_rate_pct < 90%
    duration: 2m
    type: symptom-based
    channel: slack
    owner: oncall-rag-platform
    runbook: docs/alerts.md#alert-2
  - name: cost_token_burn_spike
    severity: warning
    condition: daily_cost_usd > 2.5 or tokens_out_sum_1m > 10000
    duration: 5m
    type: symptom-based
    channel: slack
    owner: oncall-finance-ops
    runbook: docs/alerts.md#alert-3

